<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#002664" />
  <meta name="description" content="Tchad24News - Actualités du Tchad en français, arabe et anglais" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Tchad24News</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span>🇹🇩</span>
        <h1 id="appName">Tchad24News</h1>
      </div>
      <div class="actions">
        <div class="lang-switch">
          <button data-lang="fr" class="lang-btn active">FR</button>
          <button data-lang="ar" class="lang-btn">ع</button>
          <button data-lang="en" class="lang-btn">EN</button>
        </div>
        <button id="themeBtn" class="icon-btn" title="Theme">🇹🇩</button>
      </div>
    </header>

    <!-- Breaking Banner -->
    <div id="breaking" class="breaking hidden">
      <span class="badge" id="breakingLabel">DERNIÈRE HEURE</span>
      <div class="marquee"><span id="breakingTitle"></span></div>
    </div>

    <!-- Categories -->
    <div class="categories" id="categories"></div>

    <!-- Offline bar -->
    <div id="offlineBar" class="offline-bar hidden">Mode hors ligne</div>

    <!-- News List -->
    <main id="newsList" class="news-list">
      <div class="loading" id="loading">Chargement des actualités...</div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker registered'))
        .catch(err => console.log('SW registration failed', err));
    }
  </script>
</body>
</html>
