<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tchad24News</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header / Nav -->
    <header class="main-header">
        <div class="logo-container">
            <span class="flag-icon">🇹🇩</span>
            <span class="logo-text" data-i18n="siteTitle">Tchad24News</span>
        </div>
        
        <div class="header-controls">
            <!-- Language Selector -->
            <div class="lang-switch">
                <button class="lang-btn" data-lang="ar">ع</button>
                <button class="lang-btn" data-lang="fr">FR</button>
                <button class="lang-btn active" data-lang="en">EN</button>
            </div>
            <!-- Dark Mode Switch -->
            <button id="theme-toggle" class="icon-btn">🌙</button>
        </div>
    </header>

    <!-- Breaking News Ticker -->
    <div class="ticker-wrap">
        <div class="ticker-title" data-i18n="tickerTitle">BREAKING</div>
        <div class="ticker-container">
            <div id="ticker-content" data-i18n="tickerContent">
                Security measures reinforced in Chari-Baguirmi... New infrastructure projects announced...
            </div>
        </div>
    </div>

    <!-- Main Categories Bar -->
    <nav class="categories-nav">
        <button class="category-btn active" data-category="chad" data-i18n="catChad">🇹🇩 Chad</button>
        <button class="category-btn" data-category="africa" data-i18n="catAfrica">🌍 Africa</button>
        <button class="category-btn" data-category="world" data-i18n="catWorld">🌐 World</button>
        <button class="category-btn" data-category="opinion" data-i18n="catOpinion">✍️ Opinion Articles</button>
    </nav>

    <!-- Main Content Area -->
    <main>
        <!-- Standard News Grid Section -->
        <section id="news-container" class="news-grid">
            <!-- News Cards Will Render Dynamic Here -->
        </section>

        <!-- Opinion Articles & Publishing Area (Hidden by default, shown ONLY on clicking Opinion Articles) -->
        <section id="opinion-section" style="display: none;">
            
            <!-- Opinion Inner Sub-Tabs -->
            <div class="sub-tabs">
                <button class="sub-tab-btn active" data-tab="publish" data-i18n="publishTabBtn">✍️ Publish Article</button>
                <button class="sub-tab-btn" data-tab="admin" data-i18n="adminLoginBtn">🔐 Admin Login</button>
            </div>

            <!-- Tab 1: Form to Publish Article -->
            <div id="publish-form-container" class="form-card">
                <h2 data-i18n="publishTitle">Publish Your Article</h2>
                <form id="article-form">
                    <div class="form-group">
                        <label data-i18n="authorImgLabel">Author Profile Picture:</label>
                        <input type="file" id="author-img" accept="image/*">
                    </div>
                    <div class="form-group">
                        <input type="text" id="author-name" data-i18n-placeholder="authorNamePlaceholder" placeholder="Author Name" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="article-title" data-i18n-placeholder="articleTitlePlaceholder" placeholder="Article Title" required>
                    </div>
                    <div class="form-group">
                        <textarea id="article-body" rows="5" data-i18n-placeholder="articleContentPlaceholder" placeholder="Write your article here..." required></textarea>
                    </div>
                    <button type="submit" class="submit-btn" data-i18n="publishBtn">Publish Article</button>
                </form>
            </div>

            <!-- Tab 2: Admin Login Form -->
            <div id="admin-login-container" class="form-card" style="display: none;">
                <h2>Admin Login</h2>
                <form id="admin-form">
                    <div class="form-group">
                        <input type="text" placeholder="Username" required>
                    </div>
                    <div class="form-group">
                        <input type="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="submit-btn">Login</button>
                </form>
            </div>

            <!-- Published Opinion Articles List -->
            <div id="opinion-articles-list" class="news-grid">
                <!-- User submitted articles will go here -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
