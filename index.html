<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tchad24News</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- الهيدر العلوي -->
    <header class="main-header">
        <div class="logo-container">
            <span class="flag-icon">🇹🇩</span>
            <h1 class="logo-text">Tchad24News</h1>
        </div>
        <div class="header-controls">
            <div class="lang-switch">
                <button class="lang-btn active" data-lang="ar" onclick="switchLanguage('ar')">ع</button>
                <button class="lang-btn" data-lang="fr" onclick="switchLanguage('fr')">FR</button>
                <button class="lang-btn" data-lang="en" onclick="switchLanguage('en')">EN</button>
            </div>
            <button id="theme-toggle" class="icon-btn">🌙</button>
        </div>
    </header>

    <!-- الشريط العاجل -->
    <div class="ticker-wrap">
        <div class="ticker-title" data-i18n="urgent">عاجل 🚨</div>
        <div class="ticker-container">
            <div class="ticker-content" id="ticker-content">
                <span>La province du Moyen-Chari renforce son dispositif face aux urgences /// 🇹🇩 Haj 2027 : l'ORGEP annonce le lancement des préparatifs /// 🌍 Cairo hails visit by China's Xi</span>
            </div>
        </div>
    </div>

    <!-- شريط أقسام الأخبار -->
    <nav class="categories-nav">
        <button class="cat-btn active" data-category="tchad" data-i18n="cat_tchad">🇹🇩 تشاد</button>
        <button class="cat-btn" data-category="africa" data-i18n="cat_africa">🌍 إفريقيا</button>
        <button class="cat-btn" data-category="world" data-i18n="cat_world">🌐 العالم</button>
        <button class="cat-btn" data-category="opinion" data-i18n="cat_opinion">✍️ مقالات الرأي</button>
    </nav>

    <!-- المحتوى الرئيسي -->
    <main class="main-content">
        
        <!-- قسم الأخبار -->
        <section id="news-section" class="content-section active-section">
            <div class="articles-list" id="news-list">
                <!-- يتم تحميل الأخبار هنا -->
            </div>
        </section>

        <!-- قسم مقالات الرأي -->
        <section id="opinion-section" class="content-section">
            
            <!-- أزرار الإجراءات العلوي -->
            <div class="opinion-header-actions">
                <button id="btn-open-publish" class="btn-primary" onclick="togglePublishForm()" data-i18n="btn_publish_top">أنشر مقالتك ✍️</button>
                <button id="btn-admin-login" class="btn-admin" onclick="openAdminAuth()" data-i18n="btn_admin_login">دخول الأدمن 🔐</button>
            </div>

            <!-- نموذج نشر مقال رأي جديد -->
            <div id="publish-form-container" class="publish-card hidden">
                <h2 data-i18n="form_title">أنشر مقالتك</h2>
                <form id="opinion-form" onsubmit="handleArticleSubmit(event)">
                    <div class="form-group">
                        <label for="author-avatar" data-i18n="lbl_avatar">الصورة الشخصية للكاتب:</label>
                        <input type="file" id="author-avatar" accept="image/*">
                    </div>
                    <div class="form-group">
                        <input type="text" id="author-name" placeholder="اسم الكاتب" data-i18n-ph="ph_name" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="article-title" placeholder="عنوان المقال" data-i18n-ph="ph_title" required>
                    </div>
                    <div class="form-group">
                        <textarea id="article-content" rows="6" placeholder="... اكتب مقالك هنا" data-i18n-ph="ph_content" required></textarea>
                    </div>
                    <button type="submit" class="btn-publish" data-i18n="btn_submit">أنشر مقالتك</button>
                </form>
            </div>

            <!-- قائمة عرض مقالات الرأي -->
            <div class="opinion-articles-list" id="opinion-articles-container">
                <!-- يتم تحميل المقالات هنا -->
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
